name: CI Agritech API

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Tester l’API et construire l’image Docker
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Configurer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt pytest httpx

      - name: Tester l’API et Streamlit
        run: python -m pytest -q tests/

      - name: Construire l’image Docker
        run: docker build --tag agritech-api:ci .